[package]
name = "caw_modules"
version = "0.5.0"
description = "Collection of synthesizer modules for the caw synthesizer framework"
authors = ["Stephen Sherratt <stephen@sherra.tt>"]
license = "MIT"
repository = "https://github.com/gridbugs/caw.git"
documentation = "https://docs.rs/caw_modules"
edition = "2024"

[features]
web = ["getrandom", "getrandom/wasm_js"]

[dependencies]
caw_core = { version = "0.6", path = "../core" }
caw_builder_proc_macros = { version = "0.2", path = "../builder-proc-macros" }
itertools = "0.14"
wide = "1"
rand = "0.10"
log = "0.4"
getrandom = { version = "0.4", optional = true }
